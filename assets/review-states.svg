<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="746" viewBox="0 0 1200 746" role="img" aria-labelledby="title desc">
  <title id="title">Review batch states and reassignment</title>
  <desc id="desc">A queued batch is claimed by a reviewer. Each item is approved or rejected. After all decisions, the batch is complete. Revoking reviewer access returns an active batch to the queue. Previously recorded item decisions remain saved.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#087e8b"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif}.heading{fill:#12263a;font-size:34px;font-weight:700}.sub{fill:#53677b;font-size:18px}.label{fill:#12263a;font-size:24px;font-weight:700}.body{fill:#43596e;font-size:18px}.small{fill:#53677b;font-size:16px}.eyebrow{fill:#087e8b;font-size:16px;font-weight:700;letter-spacing:2px}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="710" rx="24" fill="#f4f7fb"/>
  <text x="54" y="50" class="eyebrow">WORKFLOW / STATE</text>
  <text x="54" y="100" class="heading">One batch. One active reviewer.</text>
  <text x="54" y="136" class="sub">Batch ownership can change without erasing recorded item decisions.</text>
  <rect x="54" y="226" width="300" height="124" rx="16" fill="#fff" stroke="#d8e2eb"/>
  <text x="80" y="272" class="label">Queued</text>
  <text x="80" y="305" class="body">Items already reserved</text><text x="80" y="331" class="body">Waiting for a reviewer</text>
  <rect x="450" y="226" width="300" height="124" rx="16" fill="#e3f4f2" stroke="#82bfb9"/>
  <text x="476" y="272" class="label">Assigned</text>
  <text x="476" y="305" class="body">Reviewer owns the batch</text><text x="476" y="331" class="body">Item decisions in progress</text>
  <rect x="846" y="226" width="300" height="124" rx="16" fill="#12263a"/>
  <text x="872" y="272" fill="#fff" font-size="24" font-weight="700">Complete</text>
  <text x="872" y="305" fill="#dce8f1" font-size="18">Every item has a result</text><text x="872" y="331" fill="#dce8f1" font-size="18">Counts and state saved</text>
  <path d="M354 286H450" class="line"/><text x="367" y="266" class="small">Claim</text>
  <path d="M750 286H846" class="line"/>
  <text x="771" y="245" class="small">Last item</text><text x="771" y="266" class="small">decided</text>
  <path d="M600 226V184H204V226" fill="none" stroke="#087e8b" stroke-width="2.5" marker-end="url(#teal)"/>
  <text x="258" y="174" class="small">Reviewer access revoked → return to queue</text>
  <path d="M600 350V398" class="line"/>
  <rect x="299" y="398" width="602" height="115" rx="16" fill="#fff" stroke="#d8e2eb"/>
  <text x="325" y="438" class="label">Each reserved item</text>
  <text x="325" y="470" class="body">Pending → approved or rejected</text>
  <text x="325" y="497" class="small">Ownership checked; related records remain consistent</text>
  <rect x="54" y="557" width="1092" height="83" rx="15" fill="#fff0d6"/>
  <text x="80" y="591" class="body">Repeated decision → already-processed result</text>
  <text x="80" y="618" class="small">Recorded work is checked before another decision is accepted. Concurrency needs execution testing.</text>
  <text x="54" y="684" class="small">Original illustration · neutral state names · source-reviewed transitions · no runtime capture</text>
<g id="portfolio-copyright"><rect x="0" y="710" width="1200" height="36" fill="#ffffff"/><text x="32" y="733" style="fill:#536777;font:12px Segoe UI,Arial,sans-serif">© 2026 Anton Gorodnichiy · All rights reserved · Private implementation</text></g>
</svg>
